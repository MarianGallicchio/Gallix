<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada | Gallix</title>
    <meta name="description" content="Página no encontrada. Vuelve al inicio de Gallix.">
    <link rel="icon" href="/Gallix/assets/images/favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Gallix/assets/css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="/Gallix/" class="logo">Gallix</a>
        </div>
    </header>
    <main>
        <div class="error-container">
            <div class="error-content">
                <div class="error-code">404</div>
                <h1>Página no encontrada</h1>
                <p>Lo sentimos, la página que buscas no existe o ha sido movida.</p>
                <a href="/Gallix/" class="btn btn--primary">Volver al inicio</a>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p class="footer__text">© 2025 Gallix. Todos los derechos reservados.</p>
        </div>
    </footer>
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 24px;
            text-align: center;
        }
        .error-content {
            max-width: 600px;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            color: #3b82f6;
            line-height: 1;
            margin-bottom: 16px;
        }
        .error-content h1 {
            font-size: 2rem;
            color: #111827;
            margin-bottom: 16px;
        }
        .error-content p {
            color: #6b7280;
            margin-bottom: 32px;
            font-size: 1.125rem;
        }
    </style>

    <footer class="footer">
        <div class="container">
            <p class="footer__text">© 2025 Gallix - Propietario: Mariano Gallicchio. Todos los derechos reservados.</p>
        </div>
    </footer>
</body>
</html>
